<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO-LIST do Amorzinho</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container-app">
        <h1>Task Manager Profissional</h1>
        <p>Insira uma tarefa e clique em "Adicionar tarefa" para organizar sua rotina.</p>
        <input type="text" id="input-texto" placeholder="Digite uma tarefa" aria-label="Nova tarefa">
        <button id="botao-principal">Adicionar tarefa</button>
        <ul id="tarefas"></ul>
    </div>
    <script src="script.js"></script>
</body>

</html>
